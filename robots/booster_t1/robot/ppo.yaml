# PPO architecture and ArduPilot-compatible training environment for Booster T1.
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 47 -> 512 -> 256 -> 128 -> 12, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: booster_t1
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 0.135
  obs_normalization: true
  action_scale: 1.0
  privileged_critic: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ahrs
  att_tau: 0.5
  act_max: 1.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.8
    - 0.8
    vy:
    - -0.5
    - 0.5
    wz:
    - -1.0
    - 1.0
  p_zero_command: 0.1
  p_no_lateral: 0.3
  episode_s: 30.0
  fall_tilt_deg: 60.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 1.0
    track_ang_vel: 0.5
    upright: 0.0
    pose: 0.0
    action_rate: -1.0
    tracking_sigma: 0.25
    tracking_sigma_ang: 0.25
    only_positive: true
    alive: 0.25
    tracking_filter_s: 0.0
    tracking_lin_z: 2.0
    tracking_ang_rp: 0.0
    orientation: -5.0
    walking_threshold: 0.05
    stand_still: -0.5
    body_ang_vel: -0.2
    joint_vel: -0.0001
    joint_torque: -0.01
    dof_pos_limits: -1.0
    self_collisions: -1.0
    undesired_contacts: -1.0
    foot_slip: -0.1
    air_time: 3.0
    air_time_mode: in_range
    air_time_min_s: 0.15
    air_time_max_s: 0.5
    single_stance: 1.0
    foot_alternation: 0.5
    alternation_min_air_s: 0.15
    foot_clearance: -1.0
    swing_height_m: 0.08
    foot_swing_height: -0.5
    base_height: 1.0
    base_height_target_m: 0.68
    base_height_std_m: 0.05
  ahrs_noise_rad: 0.01
  resample_s:
  - 8.0
  - 12.0
  push:
    interval_s:
    - 2.0
    - 5.0
    vel_xy: 0.1
  terminate_on_illegal_contact: true
  posture_limits:
    min_height_m: 0.45
  curriculum:
    action_rate_stages:
    - - 0
      - -1.0
    standing_stages:
    - - 0
      - 0.1
  eval_modes:
    stand:
    - 0.0
    - 0.0
    - 0.0
    forward_0.5:
    - 0.5
    - 0.0
    - 0.0
    backward_0.3:
    - -0.3
    - 0.0
    - 0.0
    lateral_0.3:
    - 0.0
    - 0.3
    - 0.0
    turn_0.8:
    - 0.0
    - 0.0
    - 0.8
