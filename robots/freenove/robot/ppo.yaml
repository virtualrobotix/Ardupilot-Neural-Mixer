# PPO architecture and ArduPilot-compatible training environment for Freenove Robot Dog.
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 45 -> 512 -> 256 -> 128 -> 12, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: freenove
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 0.8
  obs_normalization: true
  action_scale: 0.25
  privileged_critic: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ap_imu_filter
  att_tau: 0.5
  act_max: 2.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.2
    - 0.2
    vy:
    - -0.1
    - 0.1
    wz:
    - -0.8
    - 0.8
  p_zero_command: 0.02
  p_no_lateral: 0.1
  episode_s: 20.0
  fall_tilt_deg: 60.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 6.0
    track_ang_vel: 5.0
    upright: 0.0
    pose: 0.3
    action_rate: -0.1
    tracking_sigma: 0.01
    tracking_sigma_ang: 0.15
    only_positive: true
    tracking_filter_s: 0.25
    tracking_lin_z: 0.0
    tracking_ang_rp: 0.0
    no_progress: -2.5
    orientation: -5.0
    walking_threshold: 0.01
    pose_std_standing:
      .*hip_roll: 0.05
      .*hip_pitch: 0.1
      .*knee: 0.1
    pose_std_walking:
      .*hip_roll: 0.08
      .*hip_pitch: 0.35
      .*knee: 0.35
    pose_l2: -0.3
    stand_still: -1.0
    alive: 0.0
    body_ang_vel: -0.05
    dof_pos_limits: -10.0
    self_collisions: -1.0
    joint_torque: -0.05
    joint_vel: -0.001
    air_time: 5.0
    air_time_mode: touchdown
    air_time_min_s: 0.12
    air_time_max_s: 0.35
    air_time_debounce_s: 0.04
    foot_hold: -2.0
    air_time_variance: -1.0
    foot_clearance: -2.0
    foot_swing_height: -1.0
    swing_height_m: 0.015
    foot_slip: -0.1
    footfall_sequence: 0.1
    alternation_min_air_s: 0.12
    alternation_min_height_frac: 0.5
    undesired_contacts: -1.0
    base_height: 0.3
    base_height_target_m: 0.1
    base_height_std_m: 0.015
  resample_s:
  - 3.0
  - 8.0
  p_single_axis: 0.8
  single_axis_weights:
  - 0.15
  - 0.3
  - 0.1
  - 0.1
  - 0.175
  - 0.175
  push:
    interval_s:
    - 4.0
    - 8.0
    vel_xy: 0.05
  terminate_on_illegal_contact: true
  posture_limits:
    min_height_m: 0.085
    max_dev:
      .*hip_roll: 0.5
      .*hip_pitch: 0.7
  curriculum:
    action_rate_stages:
    - - 0
      - -0.1
    - - 24000
      - -0.2
    - - 36000
      - -0.4
    standing_stages:
    - - 0
      - 0.02
    - - 12000
      - 0.05
    - - 18000
      - 0.1
    - - 24000
      - 0.15
    - - 36000
      - 0.2
    - - 48000
      - 0.25
  eval_modes:
    stand:
    - 0.0
    - 0.0
    - 0.0
    forward_0.15:
    - 0.15
    - 0.0
    - 0.0
    backward_0.15:
    - -0.15
    - 0.0
    - 0.0
    lateral_0.1:
    - 0.0
    - 0.1
    - 0.0
    turn_0.6:
    - 0.0
    - 0.0
    - 0.6
