# PPO architecture and ArduPilot-compatible training environment for PhoneBot.
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 50 -> 512 -> 256 -> 128 -> 13, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: phonebot
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 0.8
  obs_normalization: true
  action_scale: 0.25
  privileged_critic: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.0003
  schedule: fixed
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ap_imu_filter
  att_tau: 0.5
  act_max: 2.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.15
    - 0.15
    vy:
    - -0.1
    - 0.1
    wz:
    - -0.6
    - 0.6
  p_zero_command: 0.05
  p_no_lateral: 0.2
  episode_s: 20.0
  fall_tilt_deg: 60.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 12.0
    track_ang_vel: 8.0
    upright: 0.0
    pose: 0.3
    action_rate: -0.1
    tracking_sigma: 0.005
    tracking_sigma_ang: 0.08
    only_positive: true
    tracking_filter_s: 0.25
    tracking_lin_z: 0.0
    tracking_ang_rp: 0.0
    no_progress: -2.5
    orientation: -8.0
    walking_threshold: 0.01
    pose_std_standing:
      .*hip_yaw: 0.05
      .*hip_roll: 0.05
      .*hip_pitch: 0.1
      .*knee_pitch: 0.1
      .*ankle_pitch: 0.1
      .*ankle_roll: 0.05
      torso_yaw: 0.05
    pose_std_walking:
      .*hip_yaw: 0.1
      .*hip_roll: 0.1
      .*hip_pitch: 0.5
      .*knee_pitch: 0.5
      .*ankle_pitch: 0.4
      .*ankle_roll: 0.1
      torso_yaw: 0.1
    pose_l2: -0.3
    stand_still: -1.0
    alive: 0.0
    body_ang_vel: -0.3
    dof_pos_limits: -10.0
    joint_vel: -0.005
    air_time: 6.0
    air_time_mode: in_range
    air_time_min_s: 0.2
    air_time_max_s: 0.5
    air_time_debounce_s: 0.04
    foot_hold: -2.0
    foot_clearance: -1.0
    foot_swing_height: -1.0
    swing_height_m: 0.035
    foot_slip: -0.1
    feet_swing: 5.0
    gait_ref: 3.0
    gait_ref_amp: 0.35
    undesired_contacts: -1.0
    base_height: 0.3
    base_height_target_m: 0.277
    base_height_std_m: 0.02
  gait_clock:
    hz_range:
    - 0.9
    - 1.3
    swing_phase:
    - 0.25
    - 0.75
    swing_period: 0.4
  eval_modes:
    stand:
    - 0.0
    - 0.0
    - 0.0
    forward_0.15:
    - 0.15
    - 0.0
    - 0.0
    backward_0.15:
    - -0.15
    - 0.0
    - 0.0
    lateral_0.1:
    - 0.0
    - 0.1
    - 0.0
    turn_0.5:
    - 0.0
    - 0.0
    - 0.5
  resample_s:
  - 4.0
  - 8.0
  push:
    interval_s:
    - 3.0
    - 6.0
    vel_xy: 0.1
  terminate_on_illegal_contact: true
  posture_limits:
    min_height_m: 0.2
  gait_reference:
    legs:
    - - left_hip_pitch
      - left_knee_pitch
      - left_ankle_pitch
    - - right_hip_pitch
      - right_knee_pitch
      - right_ankle_pitch
    gains:
    - -1.0
    - 2.0
    - -1.0
  curriculum:
    action_rate_stages:
    - - 0
      - -0.5
    - - 12000
      - -0.8
    - - 24000
      - -1.2
    standing_stages:
    - - 0
      - 0.15
